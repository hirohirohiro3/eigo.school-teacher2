<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#20242F;
  --ink-2:#5A6273;
  --paper:#FFFEFB;
  --panel:#F5F5F0;
  --rule:#D5D3CA;
  --be:#2A5C93;
  --be-bg:#E9F1F8;
  --gen:#9C540F;
  --gen-bg:#FBF0E3;
  --wrong:#AF2036;
  --right:#26714C;
  --hi-be:#CFE4F5;
  --hi-gen:#F7DFC2;
  --hand:255px 12px 225px 15px/15px 225px 15px 255px;
  --hand-2:15px 225px 15px 255px/225px 15px 255px 15px;
}

*{box-sizing:border-box;}
html{color-scheme:light;-webkit-text-size-adjust:100%;}

body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic Medium","Meiryo",sans-serif;
  font-size:16px;line-height:1.9;font-feature-settings:"palt" 1;
}

.sheet{max-width:34rem;margin:0 auto;padding:1.5rem 1.25rem 4rem;}

/* ---------- 見出し ---------- */

.unit-head{
  border-bottom:3px solid var(--ink);
  border-radius:0 0 12px 3px;
  padding-bottom:1rem;margin-bottom:2rem;
}
.unit-no{
  display:inline-block;
  font-family:"Klee One",Georgia,serif;
  font-size:.9rem;font-weight:600;color:var(--ink);
  background:var(--hi-be);padding:.05rem .7rem;
  border-radius:var(--hand);transform:rotate(-1.5deg);margin:0 0 .5rem;
}
.unit-title{
  font-family:"Klee One","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:1.55rem;line-height:1.45;font-weight:600;margin:0 0 .5rem;
}
.unit-lead{margin:0;font-size:.95rem;color:var(--ink-2);}

h2{
  font-family:"Klee One","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:1.2rem;font-weight:600;margin:2.75rem 0 1rem;line-height:1.5;
}
h2 span{
  background:linear-gradient(transparent 62%,var(--hi-be) 62%,var(--hi-be) 94%,transparent 94%);
  padding:0 .15rem;
}
h3{
  font-family:"Klee One","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:1.02rem;font-weight:600;margin:2rem 0 .75rem;
}
p{margin:0 0 1rem;}

/* ---------- 用語 ---------- */

.term{
  border:2px solid var(--be);border-radius:var(--hand);
  padding:1.1rem 1.2rem;margin:0 0 1.1rem;background:var(--be-bg);
}
.term.is-general{border-color:var(--gen);background:var(--gen-bg);border-radius:var(--hand-2);}
.term-name{
  font-family:"Klee One",sans-serif;font-size:1.08rem;font-weight:600;
  margin:0 0 .35rem;color:var(--be);
}
.term.is-general .term-name{color:var(--gen);}
.term-def{margin:0 0 .6rem;font-size:.95rem;}
.term-ex{margin:0;font-size:.9rem;color:var(--ink-2);}
.term-ex .en{color:var(--ink);}

.en{font-family:Georgia,"Times New Roman","Noto Serif JP",serif;font-size:1.02em;}
.be-w{color:var(--be);font-weight:700;}
.gen-w{color:var(--gen);font-weight:700;}

/* ---------- 図解（横組み） ---------- */

.diagram{
  border:2px solid var(--be);border-radius:var(--hand);
  padding:1.2rem .9rem 1.1rem;background:var(--paper);
  margin:0 0 1.1rem;
}
.diagram.is-general{border-color:var(--gen);border-radius:var(--hand-2);}
.diagram-cap{
  font-family:"Klee One",sans-serif;
  font-size:.85rem;color:var(--ink-2);margin:0 0 .9rem;text-align:center;
}

.flow{
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:.3rem;
}
.node{
  flex:0 1 auto;
  padding:.45rem .7rem;
  border:2px solid var(--ink);
  border-radius:var(--hand);
  background:var(--paper);
  font-family:Georgia,"Times New Roman",serif;
  font-size:1.05rem;line-height:1.5;
  text-align:center;white-space:nowrap;
}
.node:last-child{border-radius:var(--hand-2);}
.node-label{
  display:block;
  font-family:"Klee One",sans-serif;
  font-size:.68rem;line-height:1.5;color:var(--ink-2);
  white-space:nowrap;
}

.link{
  flex:1 1 3rem;
  min-width:3rem;
  display:flex;flex-direction:column;align-items:center;
}
.link-word{
  font-family:Georgia,serif;font-size:1rem;font-weight:700;
  line-height:1.3;color:var(--be);
  background:var(--hi-be);padding:0 .4rem;
  border-radius:var(--hand);
}
.is-general .link-word{color:var(--gen);background:var(--hi-gen);border-radius:var(--hand-2);}

/* be動詞：連結部そのものが「＝」 */
.rail{
  width:100%;height:.4rem;margin-top:.3rem;
  border-top:2.5px solid var(--be);
  border-bottom:2.5px solid var(--be);
}
/* 一般動詞：矢印 */
.is-general .rail{
  height:0;margin-top:.55rem;position:relative;
  border-top:2.5px solid var(--gen);
  border-bottom:none;
}
.is-general .rail::after{
  content:"";position:absolute;right:-2px;top:-5.5px;
  border-left:9px solid var(--gen);
  border-top:5px solid transparent;
  border-bottom:5px solid transparent;
}

/* ---------- 一覧表 ---------- */

.table-wrap{overflow-x:auto;margin:0 0 1.1rem;}
table.rule{
  width:100%;border-collapse:collapse;
  font-size:.9rem;line-height:1.65;
}
table.rule th,table.rule td{
  border:1px solid var(--rule);
  padding:.5rem .55rem;text-align:left;vertical-align:top;
}
table.rule th{
  background:var(--panel);
  font-family:"Klee One",sans-serif;font-weight:600;
  font-size:.82rem;color:var(--ink-2);white-space:nowrap;
}
table.rule td.be-cell{
  font-family:Georgia,serif;font-weight:700;color:var(--be);
  text-align:center;white-space:nowrap;
}

/* ---------- 手順 ---------- */

.steps{list-style:none;counter-reset:s;margin:1.25rem 0 1.5rem;padding:0;}
.steps li{counter-increment:s;position:relative;padding:0 0 1.4rem 2.8rem;margin:0;}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:.2rem;
  width:1.9rem;height:1.9rem;
  border:2px solid var(--ink);
  border-radius:48% 52% 47% 53%/53% 47% 53% 47%;
  display:flex;align-items:center;justify-content:center;
  font-family:"Klee One",serif;font-size:.95rem;font-weight:600;background:var(--paper);
}
.steps li::after{
  content:"";position:absolute;left:.9rem;top:2.2rem;bottom:.2rem;
  width:0;border-left:2px dashed var(--rule);
}
.steps li:last-child{padding-bottom:0;}
.steps li:last-child::after{display:none;}
.step-t{font-family:"Klee One",sans-serif;font-weight:600;display:block;margin-bottom:.15rem;}
.step-d{font-size:.92rem;color:var(--ink-2);}

/* ---------- 誤 / 正 ---------- */

.contrast{
  border:2px dashed var(--rule);border-radius:var(--hand);
  margin:0 0 1.1rem;overflow:hidden;
}
.contrast-row{display:flex;align-items:baseline;gap:.7rem;padding:.7rem 1rem;}
.contrast-row.bad{background:#FBF1F2;}
.contrast-row.good{background:#F0F7F3;}
.mark{flex:0 0 auto;font-size:1.2rem;font-weight:700;line-height:1.4;font-family:"Klee One",serif;}
.bad .mark{color:var(--wrong);}
.good .mark{color:var(--right);}
.bad .en{color:var(--wrong);text-decoration:line-through;text-decoration-thickness:1px;}
.contrast-why{
  padding:.55rem 1rem .7rem;font-size:.85rem;color:var(--ink-2);
  border-top:1px dashed var(--rule);background:var(--panel);
}

/* ---------- 問題 ---------- */

.q-intro{font-size:.9rem;color:var(--ink-2);margin:0 0 1.25rem;}
ol.q{list-style:none;counter-reset:q;margin:0;padding:0;}
ol.q > li{counter-increment:q;position:relative;padding:0 0 1.4rem 2.7rem;margin:0;}
ol.q > li::before{
  content:counter(q,decimal-leading-zero);
  position:absolute;left:0;top:.15rem;
  width:1.75rem;height:1.75rem;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--rule);
  border-radius:47% 53% 52% 48%/52% 48% 52% 48%;
  font-family:"Klee One",Georgia,serif;font-size:.8rem;font-weight:600;color:var(--ink-2);
}
.q-ja{display:block;font-size:.85rem;color:var(--ink-2);margin-top:.1rem;}
.choice{font-family:Georgia,serif;white-space:nowrap;}
.write{display:block;height:2rem;margin-top:.5rem;border-bottom:2px dotted var(--rule);}
.hint{font-family:"Klee One",sans-serif;font-size:.82rem;color:var(--ink-2);}

/* ---------- 問題パートの見出し ---------- */

.part-head{
  display:flex;align-items:baseline;gap:.6rem;
  margin:2.5rem 0 .6rem;padding-bottom:.45rem;
  border-bottom:2px solid var(--ink);
}
.part-no{
  flex:0 0 auto;
  font-family:"Klee One",Georgia,serif;font-size:.85rem;font-weight:600;
  color:var(--ink);background:var(--hi-gen);
  padding:.05rem .6rem;border-radius:var(--hand-2);
}
.part-name{
  font-family:"Klee One","Hiragino Kaku Gothic ProN",sans-serif;
  font-size:1.08rem;font-weight:600;line-height:1.5;
}
.part-note{
  font-size:.86rem;color:var(--ink-2);margin:0 0 1.1rem;line-height:1.75;
}

/* 選択肢（4択） */
.opts{
  display:flex;flex-wrap:wrap;gap:.25rem .85rem;
  margin:.4rem 0 0;padding:0;
  font-family:Georgia,"Times New Roman",serif;font-size:.98rem;
}
.opts span{white-space:nowrap;}

/* 条件（使用語・語数の指定） */
.cond{
  display:inline-block;
  font-family:"Klee One",sans-serif;font-size:.79rem;line-height:1.7;
  color:var(--ink-2);background:var(--panel);
  border:1px solid var(--rule);border-radius:var(--hand-2);
  padding:0 .45rem;margin-left:.4rem;white-space:nowrap;
}

/* 理由の記入欄（誤文訂正） */
.why-line{
  display:block;margin-top:.5rem;
  font-family:"Klee One",sans-serif;font-size:.82rem;color:var(--ink-2);
}
.why-line::after{
  content:"";display:block;height:1.5rem;
  border-bottom:2px dotted var(--rule);
}

/* ---------- 読解 ---------- */

.reading{
  border:2px solid var(--ink);border-radius:var(--hand);
  background:var(--paper);padding:1.1rem 1.2rem 1rem;
  margin:0 0 1.4rem;
}
.reading-cap{
  font-family:"Klee One",sans-serif;font-size:.82rem;color:var(--ink-2);
  margin:0 0 .7rem;padding-bottom:.45rem;
  border-bottom:1px dashed var(--rule);
}
.reading p{
  font-family:Georgia,"Times New Roman",serif;
  font-size:1.02rem;line-height:2;margin:0 0 .7rem;
}
.reading p:last-of-type{margin-bottom:0;}
.reading .ul{border-bottom:2px solid var(--gen);padding-bottom:1px;}
.reading .num{
  font-family:"Klee One",serif;font-size:.8rem;color:var(--ink-2);
  vertical-align:.25em;padding:0 .1rem;
}
.reading-wc{
  text-align:right;margin:.7rem 0 0;
  font-family:"Klee One",sans-serif;font-size:.74rem;color:var(--ink-2);
}

/* ---------- 解答 ---------- */

.answer-note{
  border:2px solid var(--ink);border-radius:var(--hand);
  padding:.9rem 1.1rem;font-size:.9rem;margin:0 0 1.5rem;background:var(--panel);
}
ol.a{list-style:none;counter-reset:a;margin:0;padding:0;}
ol.a > li{
  counter-increment:a;position:relative;
  padding:.9rem 0 1.1rem 2.7rem;margin:0;
  border-bottom:1px dashed var(--rule);
}
ol.a > li::before{
  content:counter(a,decimal-leading-zero);
  position:absolute;left:0;top:.95rem;
  width:1.75rem;height:1.75rem;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--rule);
  border-radius:52% 48% 47% 53%/48% 52% 48% 52%;
  font-family:"Klee One",Georgia,serif;font-size:.8rem;font-weight:600;color:var(--ink-2);
}
.a-key{
  font-weight:700;font-family:Georgia,serif;font-size:1.05rem;
  display:inline-block;margin-bottom:.15rem;
  background:linear-gradient(transparent 60%,var(--hi-gen) 60%,var(--hi-gen) 95%,transparent 95%);
  padding:0 .2rem;
}
.a-why{font-size:.9rem;color:var(--ink-2);margin:.2rem 0 0;}

.transform{
  margin:.6rem 0 .2rem;padding:.8rem 1rem;
  background:var(--panel);border:2px dashed var(--rule);
  border-radius:var(--hand-2);font-size:.92rem;
}
.tf-line{font-family:Georgia,serif;font-size:1rem;display:block;}
.tf-arrow{
  display:block;padding:.25rem 0 .25rem .2rem;
  font-family:"Klee One",sans-serif;font-size:.84rem;color:var(--ink-2);
}
.strike{color:var(--wrong);text-decoration:line-through;}

.wrap-up{
  border:2px solid var(--ink);border-radius:var(--hand);
  padding:1.1rem 1.2rem;margin-top:2.5rem;font-size:.93rem;background:var(--paper);
}
.wrap-up-t{font-family:"Klee One",sans-serif;font-weight:600;margin:0 0 .4rem;}


/* ---------- ページ間ナビ ---------- */
.topnav{display:flex;gap:.5rem;flex-wrap:wrap;margin:0 0 1.2rem;padding:0;}
.topnav a{
  text-decoration:none;
  font-family:"Klee One",sans-serif;font-size:.82rem;font-weight:600;
  line-height:1.6;padding:.22rem .7rem;
  border:1.5px solid var(--rule);border-radius:var(--hand);
  color:var(--ink-2);background:var(--panel);
}
.topnav a.pair{color:var(--gen);border-color:var(--gen);background:var(--hi-gen);border-radius:var(--hand-2);}
@media print{.topnav{display:none;}}

/* ---------- 印刷 ---------- */

@media print{
  @page{size:A4 portrait;margin:16mm 15mm;}
  body{font-size:10.5pt;line-height:1.75;background:#fff;}
  .sheet{max-width:none;padding:0;}
  .page-break{break-before:page;}
  .diagram,.contrast,.term,.transform,.wrap-up,.answer-note,.table-wrap{break-inside:avoid;}
  ol.q > li,ol.a > li,.steps li{break-inside:avoid;}
  .reading{break-inside:avoid;}
  h2{break-after:avoid;}
  .part-head{break-after:avoid;break-inside:avoid;}
  .unit-no{transform:none;}
}
</style>
</head>
<body>
<div class="sheet">
{{BODY}}
</div>
</body>
</html>
